<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER | Global Chronometrics V9</title>
    <meta name="description" content="Global time tracking with Zen Mode & Telemetry.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    <div class="noise-layer"></div>

    <div class="interface">
        <header class="glass-panel header-bar">
            <div class="brand">
                <div class="brand-mark"></div>
                <h1>AETHER<span class="highlight">SYNC</span></h1>
            </div>
            
            <div class="controls-group">
                <div class="search-module">
                    <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="globalSearch" placeholder="Locate sector... (Ctrl + K)" autocomplete="off">
                </div>
                <button id="formatToggle" class="toggle-btn">24H</button>
            </div>
        </header>

        <main id="matrix" class="grid-matrix"></main>

        <footer class="glass-panel footer-bar">
            <div class="status-indicator">
                <span class="pulse-dot"></span> System Operational
            </div>
            <p>Built with ❤️ & ☕ </p>
        </footer>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-glass">
            <button class="close-modal">&times;</button>
            <button class="zen-toggle" title="Enter Zen Mode">👁️ ZEN</button>
            
            <div class="modal-header">
                <div class="modal-flag"></div>
                <div>
                    <h2 class="modal-city"></h2>
                    <p class="modal-country"></p>
                </div>
            </div>

            <div class="modal-tabs">
                <button class="tab-btn active" data-target="clock-view">CLOCK</button>
                <button class="tab-btn" data-target="calendar-view">CALENDAR</button>
            </div>
            
            <div id="clock-view" class="tab-content active">
                <div class="analog-wrapper">
                    <div class="cyber-clock">
                        <div class="hand hour-hand"></div>
                        <div class="hand min-hand"></div>
                        <div class="hand sec-hand"></div>
                        <div class="center-dot"></div>
                        <div class="clock-markers"></div>
                    </div>
                </div>
                <div class="modal-stats">
                    <div class="stat-box">
                        <span class="label">Sunrise</span>
                        <span class="value sun-rise">--:--</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Local Time</span>
                        <span class="value digital-time">--:--</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Sunset</span>
                        <span class="value sun-set">--:--</span>
                    </div>
                </div>
            </div>

            <div id="calendar-view" class="tab-content">
                <div class="calendar-header">
                    <span class="cal-month-year">...</span>
                </div>
                <div class="calendar-weekdays">
                    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                </div>
                <div class="calendar-grid"></div>
            </div>
        </div>
    </div>

    <div id="zen-overlay">
        <div class="zen-container">
            <div class="zen-city">TEHRAN</div>
            <div class="zen-time">20:45</div>
            <div class="zen-date">Friday, December 12</div>
            <div class="zen-hint">Press ESC to exit</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
